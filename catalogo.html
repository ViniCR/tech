
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Tekoha Consultoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="l.css">
    <link rel="stylesheet" href="catalogo-style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Tekoha Consultoria</a>
            </div>
            <ul>
                <li><a href="#" class="active">Catálogo</a></li>
                <li><a href="noticia-view.html?id=100">Sobre</a></li>
                <li><a href="conteudos.html">Conteúdos</a></li>
                <li><a href="certificacoes.html">Certificações</a></li>
                <li><a href="javascript:void(0)" onclick="baixarDocumentacaoParceria()">Parceria</a></li>
                <li><a href="onstar-login.html">OnStar</a></li>
            </ul>
        </nav>
    </header>

    <main class="catalogo-main">
        <!-- Barra de Busca -->
        <section class="busca-section">
            <div class="container">
                <div class="busca-container">
                    <input type="text" id="busca-input" placeholder="O que você está procurando?" class="busca-input">
                    <button id="busca-btn" class="busca-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M21 21L16.514 16.506M19 10.5C19 15.194 15.194 19 10.5 19S2 15.194 2 10.5 5.806 2 10.5 2 19 5.806 19 10.5Z" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <div class="container">
            <div class="catalogo-layout">
                <!-- Sidebar de Filtros -->
                <aside class="filtros-sidebar">
                    <h3>Filtros</h3>
                    
                    <div class="filtro-grupo">
                        <h4>Categoria</h4>
                        <div class="filtro-opcoes">
                            <label><input type="checkbox" name="categoria" value="residencial"> Residencial</label>
                            <label><input type="checkbox" name="categoria" value="comercial"> Comercial</label>
                            <label><input type="checkbox" name="categoria" value="investimento"> Investimento</label>
                            <label><input type="checkbox" name="categoria" value="consultoria"> Consultoria</label>
                            <label><input type="checkbox" name="categoria" value="tecnologia"> Tecnologia</label>
                        </div>
                    </div>

                    <div class="filtro-grupo">
                        <h4>Preço</h4>
                        <div class="filtro-opcoes">
                            <label><input type="checkbox" name="preco" value="ate-50k"> Até R$ 50.000</label>
                            <label><input type="checkbox" name="preco" value="50k-100k"> R$ 50.000 - R$ 100.000</label>
                            <label><input type="checkbox" name="preco" value="100k-200k"> R$ 100.000 - R$ 200.000</label>
                            <label><input type="checkbox" name="preco" value="acima-200k"> Acima de R$ 200.000</label>
                        </div>
                    </div>

                    <div class="filtro-grupo">
                        <h4>Localização</h4>
                        <div class="filtro-opcoes">
                            <label><input type="checkbox" name="localizacao" value="centro"> Centro</label>
                            <label><input type="checkbox" name="localizacao" value="zona-norte"> Zona Norte</label>
                            <label><input type="checkbox" name="localizacao" value="zona-sul"> Zona Sul</label>
                            <label><input type="checkbox" name="localizacao" value="zona-oeste"> Zona Oeste</label>
                        </div>
                    </div>

                    <div class="filtro-grupo">
                        <h4>Status</h4>
                        <div class="filtro-opcoes">
                            <label><input type="checkbox" name="status" value="disponivel"> Disponível</label>
                            <label><input type="checkbox" name="status" value="em-andamento"> Em Andamento</label>
                            <label><input type="checkbox" name="status" value="concluido"> Concluído</label>
                        </div>
                    </div>

                    <button class="limpar-filtros">Limpar Filtros</button>
                </aside>

                <!-- Grid de Produtos -->
                <section class="produtos-grid-container">
                    <div class="produtos-header">
                        <div class="resultados-info">
                            <span id="total-resultados">24 resultados encontrados</span>
                        </div>
                        <div class="ordenacao">
                            <label for="ordenar">Ordenar por:</label>
                            <select id="ordenar">
                                <option value="relevancia">Relevância</option>
                                <option value="preco-menor">Menor Preço</option>
                                <option value="preco-maior">Maior Preço</option>
                                <option value="mais-recente">Mais Recente</option>
                            </select>
                        </div>
                    </div>

                    <div class="produtos-grid" id="produtos-grid">
                        <!-- Os produtos serão gerados dinamicamente -->
                    </div>

                    <div class="paginacao">
                        <button class="pag-btn" id="anterior">Anterior</button>
                        <span class="paginas">
                            <button class="pag-numero active">1</button>
                            <button class="pag-numero">2</button>
                            <button class="pag-numero">3</button>
                            <span>...</span>
                            <button class="pag-numero">10</button>
                        </span>
                        <button class="pag-btn" id="proximo">Próximo</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="catalogo-script.js"></script>
</body>
</html>
